<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>英語腦選課</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@500;600;900&display=swap" rel="stylesheet">
<style>
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}
/* Layout: one narrow column (phone first), sticky header with seal mark, sticky bottom selection bar */
:root{
  --bg:#F7F4EE; --surface:#FFFDF9; --ink:#1F2328; --muted:#6A665E; --line:#E4DED3;
  --seal:#B23A2B; --seal-ink:#FBF7F0; --chip:#EFE9DE; --focus:#1F4E6B;
  --serif:"Noto Serif TC","Songti TC",serif; --sans:"Noto Sans TC","PingFang TC",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17181A; --surface:#202124; --ink:#ECE8E1; --muted:#A39E95; --line:#34353A;
  --seal:#C4483A; --seal-ink:#FBF7F0; --chip:#2B2C30; --focus:#8DB8D4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17181A; --surface:#202124; --ink:#ECE8E1; --muted:#A39E95; --line:#34353A;
  --seal:#C4483A; --seal-ink:#FBF7F0; --chip:#2B2C30; --focus:#8DB8D4; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--sans);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header .in{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:10px}
.mark{display:flex;flex-direction:column;align-items:center;gap:1px;background:var(--seal);color:var(--seal-ink);font-family:var(--serif);font-weight:900;font-size:11px;line-height:1;padding:5px 4px;border-radius:3px}
.brand{font-family:var(--serif);font-weight:600;font-size:17px;flex:1}
.fmt{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:4px 10px;background:var(--surface);color:var(--ink);cursor:pointer}
h1{font-family:var(--serif);font-size:24px;line-height:1.35;margin:28px 0 6px;text-wrap:balance}
h2{font-family:var(--serif);font-size:19px;margin:24px 0 6px;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 18px}
.note{font-size:12.5px;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.entry{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit;cursor:pointer}
.entry b{display:block;font-family:var(--serif);font-size:17px;font-weight:600}
.entry span{font-size:13px;color:var(--muted)}
.entry .num{font-family:var(--serif);font-weight:900;color:var(--seal);font-size:20px;line-height:1.2;min-width:20px}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:14px;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip small{font-size:12px;opacity:.75}
.lvl{display:flex;flex-direction:column;gap:8px}
.lvl .chip{border-radius:12px;text-align:left;padding:12px 14px}
.lvl .chip b{display:block;font-size:15px}
.q{margin:22px 0 0}
.q h2{margin:0 0 10px;font-size:17px}
.step{font-size:12px;letter-spacing:.12em;color:var(--muted)}
input[type=text],input[type=date],input[type=time],select{font:inherit;font-size:16px;width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{font:inherit;font-weight:500;padding:12px 18px;border-radius:10px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.lesson{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.lesson.sel{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.lh{display:flex;gap:10px;align-items:flex-start}
.lh .t{flex:1;min-width:0}
.code{font-family:var(--serif);font-weight:900;font-size:13px;letter-spacing:.04em}
.ttl{font-family:var(--serif);font-weight:600;font-size:17px;line-height:1.35}
.en{font-size:13px;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.tg{font-size:12px;padding:2px 9px;border-radius:99px;background:var(--chip)}
.tg.match{background:var(--ink);color:var(--bg)}
.goal{font-size:14px}
.ph{font-size:13px;color:var(--muted);font-style:italic}
.links{display:flex;gap:8px;flex-wrap:wrap}
.links{align-items:center}.links a{font-size:13px;color:var(--ink);text-decoration:none;border:1px solid var(--line);padding:6px 12px;border-radius:8px}.links a.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);font-size:15px;padding:10px 16px}.links .dl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}.links .dl a{font-size:12.5px;padding:4px 10px}
.pick{flex:none;font:inherit;font-size:13px;padding:6px 12px;border-radius:8px;border:1px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.pick[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bar .in{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:12px}
.bar .c{flex:1;font-size:14px}
.draft{font-size:11px;color:var(--seal);border:1px solid var(--seal);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:2px}
.out{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:16px}
.out img{width:100%;max-width:360px;height:auto;border-radius:6px;box-shadow:0 4px 18px #0000001f}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;font:inherit;font-size:14px;padding:9px 6px;border:0;background:var(--surface);color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button:disabled{opacity:.35}
.sched{display:flex;flex-direction:column;gap:8px}
.sched div{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;font-size:13px}
.flabel{font-size:13px;color:var(--muted);margin:6px 0 -4px;letter-spacing:.08em}.fsum{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 0 10px;font-size:14px;font-weight:500}.fsum .chip{font-size:13px;padding:6px 12px}.empty{padding:18px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:14px}
@media (prefers-reduced-motion:no-preference){.lesson,.entry,.chip{transition:border-color .15s,background .15s}}
</style>
</head>
<body>
<header><div class="in">
  <div class="mark" aria-hidden="true"><span>英</span><span>語</span><span>腦</span></div>
  <div class="brand">選課</div>
  <button class="fmt" id="fmtBtn" hidden></button>
</div></header>

<main class="wrap" id="app"></main>

 const list=LESSONS.filter(l=>(!f.level||l.level===f.level)&&(!f.theme||l.themes.includes(f.theme)));
 app.innerHTML=`<h1>直接瀏覽課程</h1>
 <div class="stack"><p class="flabel">程度</p><div class="chips">${["全部程度",...LEVELS,"Seven Habits"].map((l,i)=>`<button class="chip" data-fl="${i?l:""}" aria-pressed="${(f.level||"")===(i?l:"")}">${l}</button>`).join("")}</div>
 <p class="flabel">主題</p><div class="chips">${[["","全部主題"],...Object.entries(THEMES).map(([k,t])=>[k,t.e+" "+t.n])].map(([k,n])=>`<button class="chip" data-ft="${k}" aria-pressed="${(f.theme||"")===k}">${n}</button>`).join("")}</div></div>
 <div class="fsum"><span>${f.level||f.theme?`篩選：${[f.level,f.theme&&THEMES[f.theme].n].filter(Boolean).join("・")}，共 ${list.length} 堂`:`全部課程，共 ${list.length} 堂`}</span>${f.level||f.theme?`<button class="chip" id="clr">清除篩選</button>`:""}</div>
 <div class="stack">${list.length?list.map(l=>lessonCard(l,true)).join(""):`<div class="empty">沒有符合這個組合的課。換個程度或主題試試。</div>`}</div>
 <div class="actions"><button class="btn ghost" id="home">回首頁</button></div>`;
 app.querySelectorAll("[data-fl]").forEach(b=>b.onclick=()=>{f.level=b.dataset.fl||null;browse();});
 app.querySelectorAll("[data-ft]").forEach(b=>b.onclick=()=>{f.theme=b.dataset.ft||null;browse();});
 if($("#clr"))$("#clr").onclick=()=>{f.level=null;f.theme=null;browse();};
 $("#home").onclick=home;bindPick();bar();
}

/* ---------- 課程卡 ---------- */
function lessonCard(l,showLinks){
 const sel=S.picked.includes(l.id);
 const id=FORMAT==="key"?l.key:l.pptx;
 return `<article class="lesson ${sel?"sel":""}">
  <div class="lh"><div class="t"><div class="code">${l.id}・${l.level}</div><div class="ttl">${l.zh}</div><div class="en">${l.en}</div></div>
  <button class="pick" data-p="${l.id}" aria-pressed="${sel}">${sel?"已選":"選這堂"}</button></div>
  <div class="meta">${S.level&&l.level!=="Seven Habits"&&l.level!==S.level?`<span class="tg">程度不同</span>`:""}${l.themes.map(t=>`<span class="tg ${S.themes.includes(t)?"match":""}">${THEMES[t].e} ${THEMES[t].n}</span>`).join("")}<span class="tg">約 ${l.pages} 頁投影片</span></div>
  <div class="goal">${l.goal}<span class="draft">初稿</span></div>
  <div class="ph">${l.ph}</div>
  ${showLinks?`<div class="links"><a class="primary" href="https://drive.google.com/file/d/${l.pdf}/view" target="_blank" rel="noopener">課程預覽</a><span class="dl">上課檔：<a href="https://drive.google.com/file/d/${l.key}/view" target="_blank" rel="noopener">Mac・Keynote</a><a href="https://drive.google.com/file/d/${l.pptx}/view" target="_blank" rel="noopener">Windows・PPT</a></span></div>`:""}
 </article>`;
}
function bindPick(){app.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{const k=b.dataset.p;S.picked=S.picked.includes(k)?S.picked.filter(x=>x!==k):[...S.picked,k];rerender&&rerender();});}
function bar(){
 const show=!!S.mode&&S.picked.length>0&&!!rerender;
 $("#bar").hidden=!show;
 if(show){$("#barText").textContent=`已選 ${S.picked.length} 堂`;$("#barBtn").onclick=()=>{F.kind=S.picked.length>1?"schedule":"single";F.colorTheme=null;cardForm();};}
}

/* ---------- 圖卡表單 ---------- */
const F={student:"",coach:"",kind:"single",date:"",time:"19:00",dates:{},wd:"4",start:"",colorTheme:null};
function cardForm(){
 rerender=null;$("#bar").hidden=true;
 const coach=S.mode!=="student";
 const lessons=S.picked.map(id=>LESSONS.find(l=>l.id===id));
 if(lessons.length>1&&F.kind==="single")F.kind="schedule";
 const themeKey=F.colorTheme||S.main||lessons[0].themes[0];
 F.colorTheme=themeKey;
 let timeHtml="";
 if(coach){
  timeHtml=`<div class="q"><h2>上課時間</h2><div class="seg" role="group">
   <button data-k="single" aria-pressed="${F.kind==="single"}" ${lessons.length>1?"disabled":""}>單堂</button>
   <button data-k="schedule" aria-pressed="${F.kind==="schedule"}">一段課表</button>
   <button data-k="period" aria-pressed="${F.kind==="period"}">一個期間</button></div>
   <div style="margin-top:12px">${
    F.kind==="single"?`<div class="row2"><label class="f">日期<input type="date" id="date" value="${F.date}"></label><label class="f">時間<input type="time" id="time" value="${F.time}"></label></div>`:
    F.kind==="schedule"?`<div class="sched">${lessons.map(l=>`<div><span>${l.id} ${l.zh}</span><input type="date" data-d="${l.id}" value="${F.dates[l.id]||""}"></div>`).join("")}</div><label class="f" style="margin-top:10px">時間<input type="time" id="time" value="${F.time}"></label>`:
    `<div class="row2"><label class="f">每週<select id="wd">${[1,2,3,4,5,6,0].map(d=>`<option value="${d}" ${String(d)===F.wd?"selected":""}>週${WD[d]}</option>`).join("")}</select></label><label class="f">時間<input type="time" id="time" value="${F.time}"></label></div><label class="f" style="margin-top:10px">開始日期<input type="date" id="start" value="${F.start}"></label>`
   }</div></div>`;
 }
 app.innerHTML=`<h1>${coach?"課程安排卡":"選課意願卡"}</h1><p class="lead">${lessons.length} 堂課・${lessons.length>1?"9:16 直式":"4:5 直式"}</p>
 <div class="stack">
  <label class="f">學員稱呼<input type="text" id="stu" maxlength="10" placeholder="例如：林小姐" value="${esc(F.student)}"></label>
  ${coach?`<label class="f">教練<input type="text" id="coa" maxlength="10" placeholder="例如：Amy" value="${esc(F.coach)}"></label>`:""}
  <label class="f">卡片主題色<select id="ct">${Object.entries(THEMES).map(([k,t])=>`<option value="${k}" ${k===themeKey?"selected":""}>${t.e} ${t.n}</option>`).join("")}</select></label>
 </div>${timeHtml}
 <div class="actions"><button class="btn ghost" id="back">回到課程</button><button class="btn" id="make">產生圖卡</button></div>`;
 const v=id=>$(id)&&$(id).value;
 const save=()=>{F.student=v("#stu")||"";if(coach)F.coach=v("#coa")||"";F.colorTheme=v("#ct");if($("#date"))F.date=v("#date");if($("#time"))F.time=v("#time");if($("#wd"))F.wd=v("#wd");if($("#start"))F.start=v("#start");app.querySelectorAll("[data-d]").forEach(i=>F.dates[i.dataset.d]=i.value);};
 app.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{save();F.kind=b.dataset.k;cardForm();});
 $("#back").onclick=()=>{save();S.mode==="browse"?browse():results();};
 $("#make").onclick=()=>{save();makeCard(lessons,coach);};
}

/* ---------- 圖卡繪製（canvas） ---------- */
const md=s=>{if(!s)return"";const [y,m,d]=s.split("-").map(Number);return `${m}/${d}`};
const wdOf=s=>{if(!s)return"";const [y,m,d]=s.split("-").map(Number);return "週"+WD[new Date(y,m-1,d).getDay()]};
function cardData(lessons,coach){
 const n=lessons.length, nm=l=>`${l.id} ${l.zh}`;
 const q=QUOTES[F.colorTheme]||QUOTES.grow, quote=q[S.quoteIx%q.length];
 const d={tall:n>1,arr:coach,theme:F.colorTheme,quote,student:F.student||"學員",coach:F.coach||"",lessons};
 if(!coach){
  const sl=S.slots.length?S.slots:["平日晚上"];const short=SLOTS.find(x=>x[0]===sl[0])[1];
  d.big=short;d.w="";d.sub=sl.length>1?`也可以：${sl.slice(1).join("・")}`:"希望上課時段";
  d.levelLine=S.levelBy==="self"&&S.level?`自評 ${S.level}`:"程度請教練評估";
  d.goal=S.goal;d.rows=lessons.map(l=>["推薦",nm(l)]);d.les1=`推薦 ${nm(lessons[0])}`;
 }else if(F.kind==="single"){
  d.big=md(F.date)||"日期";d.w=wdOf(F.date);d.sub=F.time||"";d.les1=nm(lessons[0]);
 }else if(F.kind==="schedule"){
  const ds=lessons.map(l=>F.dates[l.id]).filter(Boolean).sort();
  const first=ds[0];d.big=first?`${Number(first.split("-")[1])}月`:"課表";d.w=`${n} 堂`;
  const wds=[...new Set(ds.map(wdOf))];d.sub=(wds.length===1?wds[0]+" ":"")+(F.time||"");
  d.rows=lessons.map(l=>[md(F.dates[l.id])||"—",nm(l)]).sort((a,b)=>(F.dates[a[1].split(" ")[0]]||"z").localeCompare(F.dates[b[1].split(" ")[0]]||"z"));
  if(n===1)d.les1=nm(lessons[0]);
 }else{
  d.big="每週"+WD[Number(F.wd)];d.w="";d.sub=`${F.start?md(F.start)+" 起・":""}${F.time||""}`;
  d.rows=lessons.map((l,i)=>[`第${i+1}堂`,nm(l)]);if(n===1)d.les1=nm(lessons[0]);
 }
 return d;
}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function fit(ctx,t,w){if(ctx.measureText(t).width<=w)return t;while(t.length&&ctx.measureText(t+"…").width>w)t=t.slice(0,-1);return t+"…";}
async function draw(d){
 const W=200,H=d.tall?356:250,K=1080/W, th=THEMES[d.theme];
 const SANS='"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif',SERIF='"Noto Serif TC","Songti TC","PMingLiU",serif';
 const texts=[d.big,d.w,d.sub,th.n,d.student,d.coach,d.levelLine||"",d.goal||"",d.les1||"",(d.rows||[]).flat().join(""),d.quote.join(""),"英語腦課程安排我的選課意願學員教練・"].join("");
 try{await Promise.all([`900 38px ${SANS}`,`700 14px ${SANS}`,`500 11px ${SANS}`,`400 10px ${SANS}`,`600 12px ${SERIF}`,`900 12px ${SERIF}`,`500 10px ${SERIF}`].map(f=>document.fonts.load(f.replace(/,.*$/,""),texts)));}catch(e){}
 const c=document.createElement("canvas");c.width=1080;c.height=Math.round(H*K);
 const x=c.getContext("2d");x.scale(K,K);x.textBaseline="alphabetic";
 x.fillStyle=th.bg;x.fillRect(0,0,W,H);
 const bandY=(H-88)/2;
 // top zone
 x.fillStyle=th.band;x.font=`500 10px ${SANS}`;x.fillText(`${th.e} ${th.n}`,14,24);
 const tag=d.arr?"課程安排":"我的選課意願";x.font=`500 9.5px ${SANS}`;const tw=x.measureText(tag).width+16;
 rr(x,W-14-tw,13,tw,16,8);
 if(d.arr){x.fillStyle=th.band;x.fill();x.fillStyle=th.bg;}else{x.strokeStyle=th.band;x.lineWidth=.8;x.stroke();x.fillStyle=th.band;}
 x.fillText(tag,W-14-tw+8,24.5);
 if(d.tall){
  x.fillStyle=th.band;x.font=`400 10.5px ${SANS}`;
  const lines=[`學員 ${d.student}`,d.arr?(d.coach?`教練 ${d.coach}`:""):d.levelLine,(!d.arr&&d.goal)?d.goal:""].filter(Boolean);
  lines.forEach((t,i)=>x.fillText(fit(x,t,W-28),14,bandY-12-(lines.length-1-i)*16));
 }
 // band
 if(d.arr){x.fillStyle=th.band;x.fillRect(0,bandY,W,88);}else{x.fillStyle=th.band+"1F";x.fillRect(0,bandY,W,88);}
 const fg=d.arr?th.bg:th.band;
 x.fillStyle=fg;x.font=`900 38px ${SANS}`;
 let big=d.big;const bw=Math.min(x.measureText(big).width,W-16-58);
 x.fillText(fit(x,big,W-16-58),16,bandY+48);
 if(d.w){x.font=`700 14px ${SANS}`;x.fillText(d.w,16+bw+6,bandY+48);}
 x.font=`400 11px ${SANS}`;x.globalAlpha=.9;x.fillText(fit(x,d.sub,W-16-58),16,bandY+70);x.globalAlpha=1;
 // seal
 const sw=26,sh=54,sx=W-14-sw,sy=bandY+(88-sh)/2;rr(x,sx,sy,sw,sh,4);x.fillStyle="#B23A2B";x.fill();
 x.fillStyle="#FBF7F0";x.font=`900 12px ${SERIF}`;x.textAlign="center";["英","語","腦"].forEach((ch,i)=>x.fillText(ch,sx+sw/2,sy+18+i*15));x.textAlign="left";
 // bottom
 const by=bandY+88, bottom=H-12;
 x.fillStyle=th.band;
 const qy=bottom-15;
 x.globalAlpha=.75;d.quote.forEach((q,i)=>{let fs=9.5;x.font=`500 ${fs}px ${SERIF}`;while(x.measureText(q).width>W-28&&fs>7){fs-=.25;x.font=`500 ${fs}px ${SERIF}`;}x.fillText(fit(x,q,W-28),14,qy+i*14);});x.globalAlpha=1;
 if(!d.tall){
  x.font=`600 11.5px ${SERIF}`;x.fillText(fit(x,d.les1,W-28),14,by+20);
  x.font=`400 10px ${SANS}`;x.fillText(fit(x,`學員 ${d.student}・${d.arr?(d.coach?"教練 "+d.coach:"英語腦"):d.levelLine}`,W-28),14,by+36);
 }else{
  x.globalAlpha=.6;x.fillRect(14,by+14,W-28,.6);x.globalAlpha=1;
  (d.rows||[]).slice(0,6).forEach((r,i)=>{const y=by+32+i*17;x.font=`700 10px ${SANS}`;x.fillText(r[0],14,y);x.font=`400 10px ${SANS}`;x.fillText(fit(x,r[1],W-28-46),60,y);});
 }
 return c;
}
async function makeCard(lessons,coach){
 const d=cardData(lessons,coach);
 app.innerHTML=`<h1>${coach?"課程安排卡":"選課意願卡"}</h1><p class="lead">圖卡產生中…</p>`;
 const c=await draw(d);
 const url=c.toDataURL("image/png");
 app.innerHTML=`<h1>${coach?"課程安排卡":"選課意願卡"}</h1>
 <p class="lead">${coach?"按「儲存圖卡」存進相簿，再用 LINE 傳給學員。":"按「儲存圖卡」存進相簿，再用 LINE 傳給教練。"}也可以長按圖片儲存。</p>
 <div class="out"><img id="cardImg" src="${url}" alt="${coach?"課程安排卡":"選課意願卡"}，${esc(d.big)}"></div>
 <div class="actions"><button class="btn" id="save">儲存圖卡</button><button class="btn ghost" id="q">換一句金句</button><button class="btn ghost" id="edit">修改內容</button><button class="btn" id="home">完成</button></div>`;
 $("#q").onclick=()=>{S.quoteIx++;makeCard(lessons,coach);};
 const fname=`英語腦_${coach?"課程安排":"選課意願"}_${(d.student||"").replace(/[\\/:*?"<>|\s]/g,"")}_${d.big.replace(/[\/\s]/g,"-")}.png`;
 $("#save").onclick=async()=>{
  const blob=await new Promise(r=>c.toBlob(r,"image/png"));const file=new File([blob],fname,{type:"image/png"});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return;}}catch(e){if(e&&e.name==="AbortError")return;}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fname;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
 };
 $("#edit").onclick=cardForm;$("#home").onclick=home;
}

home();
</script>
